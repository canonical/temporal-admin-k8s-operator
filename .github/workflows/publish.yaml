name: Publish Charm

on:
  push:
    branches:
      - track/**

jobs:
  integration-tests:
    uses: ./.github/workflows/integration_test.yaml
  release-charm:
    name: Release the charm
    needs:
      - integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload charm package
        uses: canonical/charming-actions/upload-charm@2.6.2
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          channel: 1.24/edge
          tag-prefix: temporal-admin-k8s
          charmcraft-channel: 4.x/candidate
