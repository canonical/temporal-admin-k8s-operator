name: temporal-admin-k8s
display-name: Temporal Admin Tools
summary: Temporal admin tools operator
description: |
  Temporal is a developer-first, open source platform that ensures
  the successful execution of services and applications (using workflows).
maintainers:
  - Workflows Team <workflows-team@groups.canonical.com>
docs: https://discourse.charmhub.io/t/temporal-admin-documentation-overview/8939
source: https://github.com/canonical/temporal-admin-k8s-operator
tags:
  - temporal
  - workflow
  - task
  - activities
  - development
  - admin
issues: https://github.com/canonical/temporal-admin-k8s-operator/issues
assumes:
  - juju >= 3.4
  - k8s-api

peers:
  peer:
    interface: temporal-admin

provides:
  admin:
    interface: temporal
    limit: 4

requires:
  temporal-host-info:
    interface: temporal-host-info
    limit: 1
  receive-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true
    description: |
      Receives the CA that issued the Temporal frontend's certificate, so the CLI can
      verify the frontend when it serves gRPC over TLS. Integrate it with the same
      certificates provider that issues the frontend certificate.

containers:
  temporal-admin:
    resource: temporal-admin-image

resources:
  temporal-admin-image:
    type: oci-image
    description: OCI image for Temporal admin tools
    upstream-source: ubuntu/temporal-server:1.31-26.04_edge
